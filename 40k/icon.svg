<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Tabletop battle sim icon: dark field, gold targeting reticle, crimson
       objective pip. Neutral/original art (replaces the stock engine icon). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#2a241c"/>
      <stop offset="100%" stop-color="#14110c"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="19" fill="none" stroke="#8a6d3b" stroke-width="2" opacity="0.55"/>
  <!-- outer reticle ring -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#d9b06c" stroke-width="5"/>
  <!-- inner ring -->
  <circle cx="64" cy="64" r="24" fill="none" stroke="#d9b06c" stroke-width="2.5" opacity="0.8"/>
  <!-- crosshair ticks -->
  <g stroke="#d9b06c" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="10" x2="64" y2="30"/>
    <line x1="64" y1="98" x2="64" y2="118"/>
    <line x1="10" y1="64" x2="30" y2="64"/>
    <line x1="98" y1="64" x2="118" y2="64"/>
  </g>
  <!-- objective pip -->
  <circle cx="64" cy="64" r="9" fill="#b3202a"/>
  <circle cx="64" cy="64" r="9" fill="none" stroke="#e8c98a" stroke-width="2"/>
  <!-- flanking unit pips -->
  <circle cx="40" cy="88" r="4.5" fill="#e8c98a" opacity="0.85"/>
  <circle cx="88" cy="40" r="4.5" fill="#e8c98a" opacity="0.85"/>
</svg>
