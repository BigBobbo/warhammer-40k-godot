name: AI lab

# The AI's measurement machinery had no CI at all: nothing checked that the
# scoring surface stays reachable, that decision records stay honest, or that
# the AI's damage arithmetic still agrees with the engine that resolves it.
# Promotions and instrumentation rot silently without a ratchet, and the AI has
# already shipped one arithmetic divergence that cost it games for months
# (AUDIT 0.1: "D6" parsed as 1.0).
#
# Two jobs, split by what they cost:
#
#   static   — no games, no Godot. Seconds. Runs on every push.
#   oracle   — the D1 property test: the AI's expected damage against 1,500
#              seeded Monte-Carlo resolutions per (weapon, defender) pair
#              through the real RulesEngine. Minutes, headless, no rendering.
#              Runs at the test harness's DEFAULT rules edition, 11e
#              (SettingsService pins automated runs to 11; nothing here sets
#              WH40K_TEST_EDITION, and nothing should). The known-divergence
#              catalogue is stamped with the edition it was measured at and
#              the test fails at any other edition, so a stray legacy opt-in
#              cannot quietly compare against the wrong rules.
#
# Neither plays a benchmark game; game-playing lives in the nightly season
# (B5), because a 5-round mirror game is minutes of runner time each.

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      full_corpus:
        description: "Run the oracle over every weapon, not the fast tier"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.4.1"

jobs:
  static:
    runs-on: ubuntu-latest
    name: Reachability and record integrity (no games)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parameter manifest
        run: python3 tools/ai_lab/params_manifest.py

      - name: Record validator self-test
        run: python3 tools/ai_lab/validate_records.py --selftest

      - name: Profile linter self-test
        run: python3 tools/ai_lab/validate_profile.py --selftest

      - name: Lint every shipped bench profile
        run: |
          for f in 40k/tests/bench_profiles/*.json; do
            python3 tools/ai_lab/validate_profile.py "$f"
          done

      - name: Fixture gate
        run: python3 tools/ai_lab/fixture_check.py

      - name: Exam pre-flight — every exam's units exist in its fixture
        run: python3 tools/ai_lab/check_exams.py

      - name: Ratchet — reachability and instrumentation may only improve
        run: python3 tools/ai_lab/ratchet_check.py

  oracle:
    runs-on: ubuntu-latest
    name: AI damage math vs RulesEngine (D1)
    # The gating steps (fast tier ~8 min, seeded ~1 min, plus import) fit in
    # 30. A full_corpus dispatch ALSO runs the whole corpus, measured at ~32
    # min on its own, so it gets a budget that fits both.
    timeout-minutes: ${{ github.event.inputs.full_corpus == 'true' && 75 || 30 }}
    # `shell: bash` runs steps as `bash -eo pipefail`. Without it the default
    # is `bash -e`, and `godot ... | tee` reports tee's exit status, so a godot
    # crash or a FAIL exit code was invisible and only the grep decided.
    defaults:
      run:
        shell: bash
    # No WH40K_TEST_EDITION: D1 runs at the harness default, 11e.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Import project
        run: |
          cd 40k
          timeout 300 godot --headless --import || true

      # The gate. It runs on every event, a full_corpus dispatch included: the
      # committed catalogue describes this tier (it is stamped `tier: fast`).
      - name: Property test (fast tier)
        run: |
          cd 40k
          godot --headless --path . -s tests/test_ai_combat_math_property.gd -- --samples=1500 | tee /tmp/oracle.log
          grep -q "VERDICT: PASS" /tmp/oracle.log

      # INFORMATIONAL, and KNOWN RED. The catalogue covers the fast tier only.
      # At 11e the full corpus has 80 divergent pairs, and 43 of them are not
      # catalogued: 41 have the same TWIN-LINKED/[ANTI] estimator causes, 1 is
      # an engine bug (TWIN-LINKED re-rolling [ANTI] critical wounds,
      # Knucklebustas vs the hull) and 1 is rare-event Monte-Carlo noise
      # (Snazzgun - Cutta vs the hull). So this step is expected to end
      # "VERDICT: FAIL" until the full tier is catalogued. continue-on-error
      # keeps that from failing the job. The report is still there to read,
      # and the gate above is unaffected. When the full tier is catalogued,
      # remove continue-on-error so this step gates as well.
      - name: Property test (full corpus — informational, known red until catalogued)
        if: ${{ github.event.inputs.full_corpus == 'true' }}
        continue-on-error: true
        timeout-minutes: 45
        run: |
          cd 40k
          godot --headless --path . -s tests/test_ai_combat_math_property.gd -- --full --samples=1500 | tee /tmp/oracle_full.log
          grep -q "VERDICT: PASS" /tmp/oracle_full.log

      # The seeded run re-injects AUDIT 0.1 ("D6" damage parsed as 1.0). It
      # rolls every pair of every fast-tier profile whose damage string the
      # seed changes, whatever the AI predicts for it (zero included), and
      # judges each pair twice against the same samples: once with the clean
      # prediction and once with the seeded one. Only pairs that are green
      # unseeded count, so it cannot pass just because the baseline is already
      # failing (the old verdict was `failures > 0`, which a red baseline
      # satisfied on its own). The set of weapons it must catch is fixed from
      # the profiles, and must include a ranged and a melee one. That way a
      # regression that zeroes predictions cannot shrink the set until it
      # passes. It reports DETECTED only when every weapon in that set is
      # turned red on at least one defender and no seeded pair is waved
      # through by a catalogue entry. The grep matches the exact end-of-line
      # marker, because a bare "DETECTED" also matched "NOT DETECTED". pipefail
      # (above) makes godot's own exit code count as well.
      - name: Sensitivity check — the oracle must still catch AUDIT 0.1
        run: |
          cd 40k
          godot --headless --path . -s tests/test_ai_combat_math_property.gd -- --samples=600 --seeded-bug | tee /tmp/seeded.log
          grep -q -- '-> DETECTED$' /tmp/seeded.log
