name: Automated Test Suite

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run GUT Test Suite
    timeout-minutes: 25

    # Fail closed (2026-10 rules audit 9.3): every step's exit status counts.
    # A GUT hang (timeout 124), crash, missing/empty JUnit file, a GUT test file
    # that silently failed to parse, or a failing testcase that is not in
    # tests/ci/gut_known_failures.txt fails the job. Known failures are listed
    # explicitly so the list can only shrink (a fixed test must be delisted).
    # The harness runs 11e by default — the edition players get.
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        version: ${{ env.GODOT_VERSION }}
        use-dotnet: false

    - name: Verify Godot installation
      run: |
        command -v godot >/dev/null || { echo "::error::godot not on PATH after setup-godot"; exit 1; }
        godot --version

    - name: Import project
      run: |
        cd 40k
        # --import exits non-zero on benign warnings, so its exit code is not
        # the signal; a hang on ANY pass, or a missing class cache, is.
        for pass in 1 2; do
          rc=0
          timeout 240 godot --headless --import || rc=$?
          echo "import pass $pass exit $rc"
          [ "$rc" -ne 124 ] || { echo "::error::godot --import timed out (pass $pass)"; exit 1; }
        done
        [ -s .godot/global_script_class_cache.cfg ] || { echo "::error::import left no .godot/global_script_class_cache.cfg"; exit 1; }

    - name: Run Unit Tests
      run: |
        cd 40k
        rc=0
        timeout 420 godot --headless --script addons/gut/gut_cmdln.gd \
          -gdir=res://tests/unit -glog=1 \
          -gjunit_xml_file=unit_test_results.xml \
          -gexit || rc=$?
        echo "GUT unit exit $rc"
        [ "$rc" -ne 124 ] || { echo "::error::GUT unit suite hung (timeout)"; exit 1; }
        [ "$rc" -le 1 ] || { echo "::error::GUT unit suite crashed (exit $rc)"; exit 1; }
        python3 tests/ci/check_junit.py --xml unit_test_results.xml --dir tests/unit

    - name: Run Integration Tests (single-process)
      if: success() || failure()
      run: |
        cd 40k
        # test_multiplayer_* spawn host/client peers that need a display; they
        # run in scenarios.yml's multi-peer job under Xvfb.
        TESTS=$(ls tests/integration/test_*.gd | grep -v '/test_multiplayer_' | sed 's#^#res://#' | paste -sd, -)
        [ -n "$TESTS" ] || { echo "::error::no integration tests found"; exit 1; }
        rc=0
        # -gconfig= : without it GUT ADDS .gutconfig.json's dirs (unit,
        # integration, network) to -gtest, so the multiplayer tests ran too.
        timeout 420 godot --headless --script addons/gut/gut_cmdln.gd \
          -gconfig= -gtest="$TESTS" -glog=1 \
          -gjunit_xml_file=integration_test_results.xml \
          -gexit || rc=$?
        echo "GUT integration exit $rc"
        [ "$rc" -ne 124 ] || { echo "::error::GUT integration suite hung (timeout)"; exit 1; }
        [ "$rc" -le 1 ] || { echo "::error::GUT integration suite crashed (exit $rc)"; exit 1; }
        python3 tests/ci/check_junit.py --xml integration_test_results.xml --dir tests/integration --exclude-prefix test_multiplayer_

    - name: Run Network Tests
      if: success() || failure()
      run: |
        cd 40k
        rc=0
        timeout 300 godot --headless --script addons/gut/gut_cmdln.gd \
          -gdir=res://tests/network -glog=1 \
          -gjunit_xml_file=network_test_results.xml \
          -gexit || rc=$?
        echo "GUT network exit $rc"
        [ "$rc" -ne 124 ] || { echo "::error::GUT network suite hung (timeout)"; exit 1; }
        [ "$rc" -le 1 ] || { echo "::error::GUT network suite crashed (exit $rc)"; exit 1; }
        python3 tests/ci/check_junit.py --xml network_test_results.xml --dir tests/network

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          40k/*_test_results.xml
        if-no-files-found: error

  build-verification:
    runs-on: ubuntu-latest
    name: Build Verification
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        version: ${{ env.GODOT_VERSION }}
        use-dotnet: false
        include-templates: true

    - name: Import project
      run: |
        cd 40k
        for pass in 1 2; do
          rc=0
          timeout 240 godot --headless --import || rc=$?
          echo "import pass $pass exit $rc"
          [ "$rc" -ne 124 ] || { echo "::error::godot --import timed out (pass $pass)"; exit 1; }
        done
        [ -s .godot/global_script_class_cache.cfg ] || { echo "::error::import left no .godot/global_script_class_cache.cfg"; exit 1; }

    - name: Export project (Linux preset)
      run: |
        cd 40k
        mkdir -p build/linux
        timeout 300 godot --headless --export-release "Linux" build/linux/40k-game.x86_64

    - name: Verify build artifacts
      run: |
        cd 40k
        [ -s "build/linux/40k-game.x86_64" ] || { echo "::error::Linux export produced no build/linux/40k-game.x86_64"; exit 1; }
        ls -la build/linux/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: linux-build
        path: 40k/build/linux/
        if-no-files-found: error

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify project structure
      run: |
        cd 40k
        echo "--- Project Structure Check ---"
        [ -d "tests" ] || { echo "::error::tests directory missing"; exit 1; }
        [ -d "addons/gut" ] || { echo "::error::GUT addon missing"; exit 1; }
        [ -f "project.godot" ] || { echo "::error::project.godot missing"; exit 1; }
        [ -f ".gutconfig.json" ] || { echo "::error::GUT config missing"; exit 1; }
        echo "Project structure validated"

    - name: Count test files
      run: |
        cd 40k
        unit_tests=$(find tests/unit -name "test_*.gd" 2>/dev/null | wc -l | tr -d ' ')
        integration_tests=$(find tests/integration -name "test_*.gd" 2>/dev/null | wc -l | tr -d ' ')
        network_tests=$(find tests/network -name "test_*.gd" 2>/dev/null | wc -l | tr -d ' ')
        total_tests=$((unit_tests + integration_tests + network_tests))

        echo "Test file counts:"
        echo "  Unit tests: $unit_tests"
        echo "  Integration tests: $integration_tests"
        echo "  Network tests: $network_tests"
        echo "  Total test files: $total_tests"

        [ $total_tests -ge 5 ] || { echo "::error::Insufficient test coverage ($total_tests files)"; exit 1; }
        echo "Test coverage validation passed"

  notification:
    runs-on: ubuntu-latest
    name: Test Results Notification
    needs: [test, code-quality]
    if: always()

    steps:
    - name: Create summary
      run: |
        echo "## Automated Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Job Results:" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "For detailed results, check the individual job logs and artifacts." >> $GITHUB_STEP_SUMMARY
